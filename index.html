<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنصة الطبية الشاملة</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-4 min-h-screen pb-16 select-none">

  <!-- الهيدر والترحيب -->
  <header class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-xl">
        🩺
      </div>
      <div>
        <h1 class="text-base font-bold text-blue-400">المنصة الطبية الشاملة</h1>
        <p id="user-name" class="text-xs text-slate-400">أهلاً بك يا دكتور</p>
      </div>
    </div>
    <button id="admin-btn" class="hidden bg-red-600/80 hover:bg-red-600 px-3 py-1.5 rounded-xl text-xs font-bold text-white shadow-lg transition" onclick="toggleAdminPanel()">
      ⚙️ لوحة الإدارة
    </button>
  </header>

  <!-- لوحة الأدمن (تظهر للآدمن فقط) -->
  <section id="admin-panel" class="hidden bg-slate-900 p-4 rounded-2xl mb-6 border border-red-500/30 shadow-2xl space-y-3">
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <h2 class="text-xs font-bold text-red-400">➕ رفع محتوى جديد</h2>
      <button onclick="toggleAdminPanel()" class="text-xs text-slate-400">إغلاق ✖</button>
    </div>
    
    <form id="add-material-form" class="space-y-3">
      <input type="text" id="title" placeholder="عنوان المحاضرة أو الملزمة" required class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
      
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="subject" placeholder="المادة (Anatomy, Pathology...)" required class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none">
        <select id="stage" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none">
          <option value="1">المرحلة الأولى</option>
          <option value="2">المرحلة الثانية</option>
          <option value="3">المرحلة الثالثة</option>
          <option value="4">المرحلة الرابعة</option>
          <option value="5">المرحلة الخامسة</option>
          <option value="6">المرحلة السادسة</option>
        </select>
      </div>

      <!-- اختيار القسم الفرعي -->
      <div class="grid grid-cols-2 gap-2">
        <select id="category" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none">
          <option value="doctors">👨‍⚕️ محاضرات الدكاترة</option>
          <option value="younus">🎓 محاضرات الطالب يونس</option>
          <option value="download">📥 تنزيل الملازم والملفات</option>
        </select>
        
        <select id="type" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none">
          <option value="pdf">ملف PDF / ملزمة</option>
          <option value="youtube">فيديو يوتيوب / شرح</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="doctor_name" placeholder="اسم الدكتور / الشارح" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none">
        <input type="text" id="file_url" placeholder="رابط الملف أو Telegram File ID" required class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none">
      </div>
      
      <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg">
        🚀 نشر في القسم المحدّد
      </button>
    </form>
  </section>

  <!-- اختيار المرحلة الدراسية -->
  <section class="mb-4">
    <label class="text-[11px] font-bold text-slate-400 mb-1.5 block">اختر المرحلة الدراسية:</label>
    <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
      <button onclick="setStage(1)" class="stage-btn bg-blue-600 text-white px-3.5 py-2 rounded-xl font-bold shrink-0 transition">المرحلة 1</button>
      <button onclick="setStage(2)" class="stage-btn bg-slate-900 text-slate-400 border border-slate-800 px-3.5 py-2 rounded-xl font-bold shrink-0 transition">المرحلة 2</button>
      <button onclick="setStage(3)" class="stage-btn bg-slate-900 text-slate-400 border border-slate-800 px-3.5 py-2 rounded-xl font-bold shrink-0 transition">المرحلة 3</button>
      <button onclick="setStage(4)" class="stage-btn bg-slate-900 text-slate-400 border border-slate-800 px-3.5 py-2 rounded-xl font-bold shrink-0 transition">المرحلة 4</button>
      <button onclick="setStage(5)" class="stage-btn bg-slate-900 text-slate-400 border border-slate-800 px-3.5 py-2 rounded-xl font-bold shrink-0 transition">المرحلة 5</button>
      <button onclick="setStage(6)" class="stage-btn bg-slate-900 text-slate-400 border border-slate-800 px-3.5 py-2 rounded-xl font-bold shrink-0 transition">المرحلة 6</button>
    </div>
  </section>

  <!-- أزرار الأقسام الفرعية داخل المرحلة -->
  <section class="mb-5 grid grid-cols-3 gap-1.5 p-1 bg-slate-900 border border-slate-800/80 rounded-2xl">
    <button onclick="setCategory('doctors')" class="cat-btn bg-blue-600/30 text-blue-400 border border-blue-500/40 py-2 rounded-xl text-[11px] font-bold transition flex flex-col items-center gap-1">
      <span>👨‍⚕️</span>
      <span>محاضرات الدكاترة</span>
    </button>
    <button onclick="setCategory('younus')" class="cat-btn text-slate-400 py-2 rounded-xl text-[11px] font-bold transition flex flex-col items-center gap-1">
      <span>🎓</span>
      <span>محاضرات يونس</span>
    </button>
    <button onclick="setCategory('download')" class="cat-btn text-slate-400 py-2 rounded-xl text-[11px] font-bold transition flex flex-col items-center gap-1">
      <span>📥</span>
      <span>تنزيل الملازم</span>
    </button>
  </section>

  <!-- البحث -->
  <section class="mb-4">
    <input type="text" id="search-input" oninput="filterMaterials()" placeholder="🔍 ابحث في هذا القسم..." class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
  </section>

  <!-- قائمة المحتوى -->
  <main>
    <div class="flex justify-between items-center mb-3">
      <h2 id="section-title" class="text-xs font-bold text-slate-300">👨‍⚕️ محاضرات الدكاترة - المرحلة 1</h2>
      <span class="text-[10px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded-full border border-slate-800" id="total-count">0 عناصر</span>
    </div>

    <div id="materials-list" class="space-y-2.5">
      <!-- Skeleton Loaders -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800/60 animate-pulse h-16"></div>
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800/60 animate-pulse h-16"></div>
    </div>
  </main>

  <!-- عارض الـ PDF / الفيديو الداخلي -->
  <div id="viewer-modal" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex-col">
    <div class="flex justify-between items-center p-3 bg-slate-900 border-b border-slate-800">
      <h3 id="viewer-title" class="text-xs font-bold text-slate-200 truncate max-w-[70%]">عرض المحتوى</h3>
      <button onclick="closeViewer()" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold shadow">
        إغلاق ✖
      </button>
    </div>
    <div class="flex-1 w-full h-full bg-slate-900 flex items-center justify-center">
      <iframe id="viewer-iframe" class="w-full h-full border-0" src=""></iframe>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const SUPABASE_URL = "https://iqcppnvolmzumdsdjgcl.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_3R0W8KSkQETjaTSL3XfHpw_UH4piv3i"; 
    const ADMIN_TELEGRAM_ID = 5550753912; 

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let allMaterials = [];
    let activeStage = 1;
    let activeCategory = 'doctors';
    let isAdmin = false;

    // التحقق من هوية المستخدم
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-name').innerText = `أهلاً دكتور ${user.first_name || ''}`;
      if (user.id === ADMIN_TELEGRAM_ID) {
        isAdmin = true;
        document.getElementById('admin-btn').classList.remove('hidden');
      }
    } else {
      isAdmin = true; // للتجربة خارج تطبيق التلجرام
      document.getElementById('admin-btn').classList.remove('hidden');
    }

    function toggleAdminPanel() {
      document.getElementById('admin-panel').classList.toggle('hidden');
    }

    // جلب البيانات
    async function fetchMaterials() {
      try {
        const { data, error } = await _supabase
          .from('Miniapp')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        allMaterials = data || [];
        filterMaterials();
      } catch (err) {
        document.getElementById('materials-list').innerHTML = `<p class="text-red-400 text-xs text-center py-6">حدث خطأ أثناء تحميل المحتوى</p>`;
      }
    }

    function setStage(stage) {
      activeStage = stage;
      document.querySelectorAll('.stage-btn').forEach((btn, index) => {
        if (index + 1 === stage) {
          btn.className = 'stage-btn bg-blue-600 text-white px-3.5 py-2 rounded-xl font-bold shrink-0 transition';
        } else {
          btn.className = 'stage-btn bg-slate-900 text-slate-400 border border-slate-800 px-3.5 py-2 rounded-xl font-bold shrink-0 transition';
        }
      });
      filterMaterials();
    }

    function setCategory(cat) {
      activeCategory = cat;
      const catBtns = document.querySelectorAll('.cat-btn');
      
      catBtns.forEach(btn => btn.className = 'cat-btn text-slate-400 py-2 rounded-xl text-[11px] font-bold transition flex flex-col items-center gap-1');

      if (cat === 'doctors') catBtns[0].className = 'cat-btn bg-blue-600/30 text-blue-400 border border-blue-500/40 py-2 rounded-xl text-[11px] font-bold transition flex flex-col items-center gap-1';
      if (cat === 'younus') catBtns[1].className = 'cat-btn bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 py-2 rounded-xl text-[11px] font-bold transition flex flex-col items-center gap-1';
      if (cat === 'download') catBtns[2].className = 'cat-btn bg-amber-600/30 text-amber-400 border border-amber-500/40 py-2 rounded-xl text-[11px] font-bold transition flex flex-col items-center gap-1';

      filterMaterials();
    }

    function filterMaterials() {
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      
      const filtered = allMaterials.filter(item => {
        const matchesStage = item.stage == activeStage;
        const matchesCat = (item.category || 'doctors') === activeCategory;
        const matchesSearch = (item.title || '').toLowerCase().includes(searchVal) ||
                              (item.doctor_name || '').toLowerCase().includes(searchVal) ||
                              (item.subject || '').toLowerCase().includes(searchVal);
        return matchesStage && matchesCat && matchesSearch;
      });

      // تحديث العنوان
      const catNames = {
        'doctors': '👨‍⚕️ محاضرات الدكاترة',
        'younus': '🎓 محاضرات يونس',
        'download': '📥 تنزيل الملازم والملفات'
      };
      document.getElementById('section-title').innerText = `${catNames[activeCategory]} - المرحلة ${activeStage}`;

      renderMaterials(filtered);
    }

    function renderMaterials(list) {
      const container = document.getElementById('materials-list');
      document.getElementById('total-count').innerText = `${list.length} عناصر`;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-slate-900/50 rounded-2xl border border-slate-800/40">
            <p class="text-slate-500 text-xs">لا يوجد محتوى مضاف لهذا القسم حالياً 📭</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800/80 hover:border-slate-700 transition flex justify-between items-center gap-3">
          <div class="space-y-1">
            <span class="text-[9px] font-bold text-blue-400 bg-blue-950/80 border border-blue-800/40 px-2 py-0.5 rounded-md">
              ${item.subject || 'عام'}
            </span>
            <h3 class="font-bold text-xs text-slate-100">${item.title}</h3>
            <p class="text-[10px] text-slate-400">👨‍⚕️ ${item.doctor_name || 'غير محدد'}</p>
          </div>
          <div class="flex items-center gap-2">
            ${isAdmin ? `<button onclick="deleteMaterial(${item.id})" class="text-red-400 hover:text-red-300 text-xs p-1">🗑️</button>` : ''}
            
            ${activeCategory === 'download' ? 
              `<button onclick="openViewer('${item.file_url}', '${item.title}', '${item.type}')" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded-xl text-[11px] font-bold text-white shadow transition">
                📥 فتح / تنزيل
              </button>` : 
              `<button onclick="openViewer('${item.file_url}', '${item.title}', '${item.type}')" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded-xl text-[11px] font-bold text-white shadow transition">
                ${item.type === 'pdf' ? '📖 عرض' : '🎥 مشاهدة'}
              </button>`
            }
          </div>
        </div>
      `).join('');
    }

    // الدالة الذكية لفتح الملفات وتوليد روابط تلجرام تلقائياً
    async function openViewer(urlOrFileId, title, type) {
      const modal = document.getElementById('viewer-modal');
      const iframe = document.getElementById('viewer-iframe');
      document.getElementById('viewer-title').innerText = title + " (جاري التحميل...)";

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      iframe.src = '';

      let targetUrl = urlOrFileId;

      // إذا كان المدخل عبارة عن File ID وليس رابط عادي
      if (!urlOrFileId.startsWith('http://') && !urlOrFileId.startsWith('https://')) {
        try {
          // جلب مسار الملف المباشر باستخدام الـ API المربوط بالـ Bot Token
          const response = await fetch(`/api/get-file?file_id=${urlOrFileId}`);
          const data = await response.json();
          if (data.url) {
            targetUrl = data.url;
          } else {
            alert('تعذر جلب الملف من تلجرام، يرجى التأكد من الـ Bot Token و الـ File ID');
            closeViewer();
            return;
          }
        } catch (err) {
          alert('خطأ في الاتصال بالسيرفر');
          closeViewer();
          return;
        }
      }

      document.getElementById('viewer-title').innerText = title;

      // عرض الـ PDF أو الفيديو
      if (type === 'pdf') {
        iframe.src = `https://docs.google.com/gview?url=${encodeURIComponent(targetUrl)}&embedded=true`;
      } else {
        iframe.src = targetUrl;
      }
    }

    function closeViewer() {
      const modal = document.getElementById('viewer-modal');
      const iframe = document.getElementById('viewer-iframe');
      iframe.src = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function deleteMaterial(id) {
      if (!confirm('هل انت تأكد من الحذف؟')) return;
      try {
        const { error } = await _supabase.from('Miniapp').delete().eq('id', id);
        if (error) throw error;
        fetchMaterials();
      } catch (err) {
        alert('خطأ أثناء الحذف: ' + err.message);
      }
    }

    // إضافة محتوى
    document.getElementById('add-material-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري النشر...';

      const title = document.getElementById('title').value;
      const subject = document.getElementById('subject').value;
      const stage = parseInt(document.getElementById('stage').value);
      const category = document.getElementById('category').value;
      const type = document.getElementById('type').value;
      const doctor_name = document.getElementById('doctor_name').value;
      const file_url = document.getElementById('file_url').value;

      try {
        const { error } = await _supabase.from('Miniapp').insert([
          { title, subject, stage, category, type, doctor_name, file_url }
        ]);

        if (error) throw error;

        alert('تم بنجاح! 🎉');
        document.getElementById('add-material-form').reset();
        toggleAdminPanel();
        fetchMaterials();
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '🚀 نشر في القسم المحدّد';
      }
    });

    fetchMaterials();
  </script>
</body>
</html>
